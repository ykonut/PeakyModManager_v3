name: Sync Upstream & Release

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）自动检查上游新版本号
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout macos-symlink-fix
        uses: actions/checkout@v4
        with:
          ref: macos-symlink-fix
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check upstream latest release tag
        id: tags
        run: |
          UPSTREAM_TAG=$(gh release list --repo Tian-W001/PeakyModManager_v3 --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          LOCAL_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          echo "upstream_tag=$UPSTREAM_TAG"
          echo "local_tag=$LOCAL_TAG"
          echo "UPSTREAM_TAG=$UPSTREAM_TAG" >> "$GITHUB_ENV"
          echo "LOCAL_TAG=$LOCAL_TAG" >> "$GITHUB_ENV"
          if [ -n "$UPSTREAM_TAG" ] && [ "$UPSTREAM_TAG" != "$LOCAL_TAG" ]; then
            echo "发现上游新版本 $UPSTREAM_TAG → 需要发布"
            echo "NO_UPDATE=0" >> "$GITHUB_ENV"
          else
            echo "上游没有新版本（当前均为 $UPSTREAM_TAG），跳过。✅"
            echo "NO_UPDATE=1" >> "$GITHUB_ENV"
          fi

      - name: Sync upstream code & set version
        if: env.NO_UPDATE == '0'
        run: |
          git remote add upstream https://github.com/Tian-W001/PeakyModManager_v3.git
          git fetch upstream
          git merge upstream/main --no-edit
          VERSION_NUM="${UPSTREAM_TAG#v}"
          npm version "$VERSION_NUM" --no-git-tag-version
          echo "VERSION_NUM=$VERSION_NUM" >> "$GITHUB_ENV"

      - name: Upstream has no new version
        if: env.NO_UPDATE == '1'
        run: echo "上游没有新版本，跳过构建。✅"

      - name: Install dependencies
        if: env.NO_UPDATE == '0'
        run: npm install

      - name: Build and Publish
        if: env.NO_UPDATE == '0'
        run: |
          npm run build
          npx electron-builder --mac --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push merged branch
        if: env.NO_UPDATE == '0'
        run: git push origin macos-symlink-fix