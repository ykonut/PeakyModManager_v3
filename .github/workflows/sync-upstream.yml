name: Sync Upstream & Release

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）自动检查上游版本号
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout macos-symlink-fix
        uses: actions/checkout@v4
        with:
          ref: macos-symlink-fix
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream & compare version
        run: |
          git remote add upstream https://github.com/Tian-W001/PeakyModManager_v3.git
          git fetch upstream
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          UPSTREAM_VERSION=$(git show upstream/main:package.json | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "")
          echo "local_version=$LOCAL_VERSION"
          echo "upstream_version=$UPSTREAM_VERSION"
          echo "LOCAL_VERSION=$LOCAL_VERSION" >> "$GITHUB_ENV"
          echo "UPSTREAM_VERSION=$UPSTREAM_VERSION" >> "$GITHUB_ENV"
          if [ "$LOCAL_VERSION" = "$UPSTREAM_VERSION" ]; then
            echo "版本号相同，上游未发布新版本，跳过。✅"
            echo "NO_UPDATE=1" >> "$GITHUB_ENV"
          else
            git merge upstream/main --no-edit
            echo "NO_UPDATE=0" >> "$GITHUB_ENV"
          fi

      - name: Release tag already exists
        if: env.NO_UPDATE == '0'
        run: |
          if gh release view "v${{ env.UPSTREAM_VERSION }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "该版本号已发布过，跳过发布（严格跟随上游）。✅"
            echo "NO_UPDATE=1" >> "$GITHUB_ENV"
          fi

      - name: Upstream has no new version
        if: env.NO_UPDATE == '1'
        run: echo "上游没有新版本，跳过构建。✅"

      - name: Install dependencies
        if: env.NO_UPDATE == '0'
        run: npm install

      - name: Build and Publish
        if: env.NO_UPDATE == '0'
        run: |
          npm run build
          npx electron-builder --mac --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push merged branch
        if: env.NO_UPDATE == '0'
        run: git push origin macos-symlink-fix